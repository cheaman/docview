<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>문서 보기</title>
<!-- 문서 보기 — 보기 화면 (2단계 · 2026-10-03 · 시안 B 종이)
     구역 지도 : ① 색 이름 ② 모양 ③ 화면 뼈대(목록 · 보기 · 판) ④ app.js
     PC 크롬에서 열면 가짜 다리(시험용 목록)로 돈다 — 폰에서는 앱 껍데기의 window.Android 를 씀 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="문서 보기">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1d24" media="(prefers-color-scheme: dark)">
<meta name="docview-ver" content="1003-085200">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></symbol>
  <symbol id="i-page" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 8h6M9 12h6"/></symbol>
  <symbol id="i-find" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-size" viewBox="0 0 24 24"><path d="M4 18L9 6l5 12M5.8 14h6.4M15 18l3-7 3 7M15.9 16h4.2"/></symbol>
  <symbol id="i-plain" viewBox="0 0 24 24"><path d="M5 6h14M5 10h14M5 14h10M5 18h7"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 4l9 5-9 5-9-5z"/><path d="M3 14l9 5 9-5"/></symbol>
  <symbol id="i-bg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-rot" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1.2-4.8L15.5 4.9a2 2 0 0 1 2.8 0l.8.8a2 2 0 0 1 0 2.8L8.8 18.8z"/><path d="M13.5 7l3.5 3.5"/></symbol>
  <symbol id="i-memo" viewBox="0 0 24 24"><path d="M5 4h14v10.5L13.5 20H5z"/><path d="M13.5 20v-5.5H19M8.5 9h7M8.5 12.5h4"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M9 20h11"/><path d="M4.6 14.4l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 18H8.2z"/><path d="M9 9l6 6"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 13L4 8l5-5"/><path d="M4 8h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/></symbol>
  <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3.5 16.5L16.5 3.5l4 4L7.5 20.5z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="7" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="7" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="7" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="7" rx="1.2"/></symbol>
</svg>

<!-- ③-① 최근 목록 -->
<section id="home" class="view">
  <header class="bar"><h1>문서 보기</h1></header>
  <main id="list" class="list"></main>
  <div id="empty" class="empty" hidden>
    <div class="big"><svg class="ico"><use href="#i-doc"/></svg></div>
    <h2>아직 연 문서 없음</h2>
    <div class="how">
      <div><b>카톡에서</b> → 파일 누름 → <span class="pill">⋮</span> → <span class="pill">다른 앱으로 열기</span> → 문서 보기</div>
      <div><b>되는 파일</b> → PDF · 한글(HWP · HWPX) · 워드(DOC · DOCX) · TXT · 엑셀(XLS · XLSX) · HTML · 그림(JPG · PNG · HEIC 등) · 도면(DXF)</div>
    </div>
  </div>
  <button id="pick" class="fab"><svg class="ico"><use href="#i-open"/></svg>파일 열기</button>
</section>

<!-- ③-② 보기 -->
<section id="viewer" class="view" hidden>
  <header class="bar" id="vbar">
    <button class="ib" id="back" aria-label="뒤로"><svg class="ico"><use href="#i-back"/></svg></button>
    <div class="t"><div class="n" id="vname"></div><div class="s" id="vsub"></div></div>
    <button class="ib memo-b" id="memo" aria-label="쪽지"><svg class="ico"><use href="#i-memo"/></svg></button>
  </header>
  <header class="bar findbar" id="findbar" hidden>
    <button class="ib" id="fclose" aria-label="찾기 닫기"><svg class="ico"><use href="#i-back"/></svg></button>
    <label class="field"><svg class="ico"><use href="#i-find"/></svg><input id="fq" type="search" placeholder="찾을 낱말" enterkeyhint="search" autocomplete="off"></label>
    <span class="cnt" id="fcnt"></span>
    <button class="ib" id="fprev" aria-label="앞"><svg class="ico"><use href="#i-up"/></svg></button>
    <button class="ib" id="fnext" aria-label="뒤"><svg class="ico"><use href="#i-down"/></svg></button>
  </header>
  <div id="memobox" class="memobox" hidden><div class="mt" id="memotext" role="button"></div><button class="ib" id="memofold" aria-label="쪽지 접기"><svg class="ico"><use href="#i-x"/></svg></button></div>
  <div id="note" class="note" hidden></div>
  <main id="reader" class="reader"><div id="pages" class="pages"></div></main>
  <main id="flow" class="flow" hidden><div id="flowin" class="flowin"></div></main>
  <main id="cadbox" class="cadbox" hidden><canvas id="cad"></canvas><div id="cadnotes" class="cadnotes"></div></main>
  <div id="chip" class="chip" hidden></div>
  <div id="penpal" class="penpal" hidden></div>
  <div id="penbar" class="penbar" hidden>
    <div class="펜종류"><button data-m="펜">펜</button><button data-m="형광">형광</button><button data-m="메모">메모</button></div>
    <button class="펜지금" id="pencolor" aria-label="색 고르기"><i id="pencolordot"></i><svg class="ico"><use href="#i-down"/></svg></button>
    <span class="갈피"></span>
    <button class="pb" id="eraser"><svg class="ico"><use href="#i-eraser"/></svg>지우개</button>
    <button class="pb" id="undo"><svg class="ico"><use href="#i-undo"/></svg>되돌리기</button>
    <button class="pb" id="penoff" aria-label="펜 끄기"><svg class="ico"><use href="#i-x"/></svg></button>
  </div>
  <div id="measbar" class="penbar measbar" hidden>
    <div class="재기글" id="meastext"></div>
    <button class="pb" id="measundo"><svg class="ico"><use href="#i-undo"/></svg>한 점</button>
    <button class="pb" id="measclear">새로</button>
    <button class="pb" id="measoff" aria-label="재기 끄기"><svg class="ico"><use href="#i-x"/></svg></button>
  </div>
  <footer class="tools" id="tools">
    <button class="tool" id="goto"><svg class="ico"><use href="#i-grid"/></svg>쪽 목록</button>
    <button class="tool" id="find"><svg class="ico"><use href="#i-find"/></svg>찾기</button>
    <button class="tool" id="size"><svg class="ico"><use href="#i-size"/></svg>글씨</button>
    <button class="tool" id="plain"><svg class="ico"><use href="#i-plain"/></svg><span id="plainlab">글자만</span></button>
    <button class="tool" id="fit"><svg class="ico"><use href="#i-fit"/></svg>맞춤</button>
    <button class="tool" id="layers"><svg class="ico"><use href="#i-layers"/></svg>레이어</button>
    <button class="tool" id="rot"><svg class="ico"><use href="#i-rot"/></svg>돌리기</button>
    <button class="tool" id="pen"><svg class="ico"><use href="#i-pen"/></svg>펜</button>
    <button class="tool" id="measure"><svg class="ico"><use href="#i-ruler"/></svg>재기</button>
    <button class="tool" id="share"><svg class="ico"><use href="#i-share"/></svg>보내기</button>
  </footer>
</section>

<!-- ③-④ PDF 쪽 목록 (v0.7) -->
<section id="thumbs" class="view thumbs" hidden>
  <header class="bar">
    <button class="ib" id="tclose" aria-label="닫기"><svg class="ico"><use href="#i-back"/></svg></button>
    <div class="t"><div class="n">쪽 목록</div><div class="s" id="tsub"></div></div>
    <label class="field 쪽칸"><input id="tn" type="number" inputmode="numeric" placeholder="쪽 번호" min="1" enterkeyhint="go"></label>
    <button class="btn" id="tgo">이동</button>
  </header>
  <main id="tgrid" class="tgrid"></main>
</section>

<!-- ③-③ 아래에서 올라오는 판 (⋯ · 쪽 이동) -->
<div id="dim" class="dim" hidden></div>
<div id="sheet" class="sheet" hidden></div>

<script src="zip.js"></script>
<script src="docs.js"></script>
<script src="cfb.js"></script>
<script src="hwpdoc.js"></script>
<script src="pen.js"></script>
<script src="dxf.js"></script>
<script src="xls.js"></script>
<script src="html.js"></script>
<script src="share.js"></script>
<script src="web.js"></script>
<script src="app.js"></script>
<script src="memo.js"></script>
</body>
</html>
