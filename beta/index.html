<!-- ③-① 최근 목록 -->
<section id="home" class="view">
  <header class="bar" id="homebar"><span class="dsm-mark" aria-hidden="true"><b>DSM</b><i><u></u><u></u><u></u><u></u></i></span><h1>문서 보기</h1><button class="tovideo 찾기단추" id="gfind" aria-label="전체 찾기"><svg class="ico"><use href="#i-find"/></svg></button><button class="tovideo" id="selbtn">고르기</button><a class="tovideo" href="video/index.html">🎬 영상</a></header>
  <header class="bar" id="selbar" hidden><h1 id="selcnt">0개 고름</h1><button class="tovideo" id="selall">다 고르기</button><button class="tovideo" id="seldone">끝</button></header>
  <header class="bar findbar" id="gbar" hidden><button class="ib" id="gclose" aria-label="찾기 닫기"><svg class="ico"><use href="#i-back"/></svg></button><label class="field"><svg class="ico"><use href="#i-find"/></svg><input id="gq" type="search" placeholder="파일 이름 · 문서 속 글" enterkeyhint="search" autocomplete="off"></label></header>
  <div id="kinds" class="칩줄" hidden></div>
  <main id="list" class="list"></main>
  <div id="empty" class="empty" hidden>
    <div class="big"><svg class="ico"><use href="#i-doc"/></svg></div>
    <h2>아직 연 문서 없음</h2>
    <div class="how">
      <div><b>카톡에서</b> → 파일 누름 → <span class="pill">⋮</span> → <span class="pill">다른 앱으로 열기</span> → 문서 보기</div>
      <div><b>되는 파일</b> → PDF · 한글(HWP · HWPX) · 워드(DOC · DOCX) · TXT · 엑셀(XLS · XLSX) · PPT(PPTX · 옛 PPT) · HTML · 그림(JPG · PNG · HEIC 등) · 도면(DXF) · 압축(ZIP — 풀지 않고 안을 봄)</div>
      <div><b>녹화 영상</b> → 갤러리에서 <span class="pill">공유</span> → 문서 보기 → 장면판으로 클로드에게 (위 🎬)</div>
    </div>
  </div>
  <button id="pick" class="fab"><svg class="ico"><use href="#i-open"/></svg>파일 열기</button>
  <div id="selfoot" class="selfoot" hidden><button id="selpdf" class="새것" hidden>📄 PDF 로</button><button id="selcmp" class="새것" hidden>⇄ 견주기</button><button id="selfav">⭐ 즐겨찾기</button><button id="selgroup">🏷 묶음</button><button id="seldel" class="지움">지우기</button></div>
  <div class="서명" id="sign">DSM · 34 문서보기</div>
</section>

<!-- ③-② 보기 -->
<section id="viewer" class="view" hidden>
  <header class="bar" id="vbar">
    <button class="ib" id="back" aria-label="뒤로"><svg class="ico"><use href="#i-back"/></svg></button>
    <div class="t"><div class="n" id="vname"></div><div class="s" id="vsub"></div></div>
    <button class="ib 밤-b" id="nightbtn" aria-label="밤 보기" hidden>🌙</button>
    <button class="ib bmk-b" id="bmk" aria-label="책갈피" hidden><svg class="ico"><use href="#i-mark"/></svg></button>
    <button class="ib memo-b" id="memo" aria-label="쪽지"><svg class="ico"><use href="#i-memo"/></svg></button>
  </header>
  <header class="bar findbar" id="findbar" hidden>
    <button class="ib" id="fclose" aria-label="찾기 닫기"><svg class="ico"><use href="#i-back"/></svg></button>
    <label class="field"><svg class="ico"><use href="#i-find"/></svg><input id="fq" type="search" placeholder="찾을 낱말" enterkeyhint="search" autocomplete="off"></label>
    <span class="cnt" id="fcnt"></span>
    <button class="ib" id="fprev" aria-label="앞"><svg class="ico"><use href="#i-up"/></svg></button>
    <button class="ib" id="fnext" aria-label="뒤"><svg class="ico"><use href="#i-down"/></svg></button>
  </header>
  <div id="memobox" class="memobox" hidden><div class="mt" id="memotext" role="button"></div><button class="ib" id="memofold" aria-label="쪽지 접기"><svg class="ico"><use href="#i-x"/></svg></button></div>
  <div id="note" class="note" hidden></div>
  <main id="reader" class="reader"><div id="pages" class="pages"></div></main>
  <main id="flow" class="flow" hidden><div id="flowin" class="flowin"></div></main>
  <main id="zipbox" class="list zipbox" hidden></main>
  <main id="cadbox" class="cadbox" hidden><canvas id="cad"></canvas><div id="cadnotes" class="cadnotes"></div></main>
  <div id="resume" class="이어봄" hidden><span id="resumetext"></span><button id="resumetop">처음부터</button></div>
  <div id="penpal" class="penpal" hidden></div>
  <div id="shapebar" class="shapebar" hidden><button data-f="a"><svg class="ico"><use href="#i-arrow"/></svg>화살표</button><button data-f="r"><svg class="ico"><use href="#i-box"/></svg>네모</button><button data-f="o"><svg class="ico"><use href="#i-oval"/></svg>동그라미</button><button data-f="t"><svg class="ico"><use href="#i-text"/></svg>글</button></div>
  <div id="stampbar" class="shapebar 도장줄" hidden></div>
  <div id="penbar" class="penbar" hidden>
    <div class="펜종류"><button data-m="펜">펜</button><button data-m="형광">형광</button><button data-m="메모">메모</button><button data-m="도형">도형</button><button data-m="도장">도장</button></div>
    <button class="펜지금" id="pencolor" aria-label="색 고르기"><i id="pencolordot"></i><svg class="ico"><use href="#i-down"/></svg></button>
    <span class="갈피"></span>
    <button class="pb" id="eraser"><svg class="ico"><use href="#i-eraser"/></svg>지우개</button>
    <button class="pb" id="undo"><svg class="ico"><use href="#i-undo"/></svg>되돌리기</button>
    <button class="pb" id="penoff" aria-label="펜 끄기"><svg class="ico"><use href="#i-x"/></svg></button>
  </div>
  <div id="measbar" class="penbar measbar" hidden>
    <div class="재기글" id="meastext"></div>
    <button class="pb" id="measscale" hidden>축척</button>
    <button class="pb" id="meassave" hidden>남기기</button>
    <button class="pb" id="measundo"><svg class="ico"><use href="#i-undo"/></svg>한 점</button>
    <button class="pb" id="measclear">새로</button>
    <button class="pb" id="measoff" aria-label="재기 끄기"><svg class="ico"><use href="#i-x"/></svg></button>
  </div>
  <footer class="tools" id="tools">
    <button class="tool" id="goto"><svg class="ico"><use href="#i-grid"/></svg>쪽 목록</button>
    <button class="tool" id="find"><svg class="ico"><use href="#i-find"/></svg>찾기</button>
    <button class="tool" id="size"><svg class="ico"><use href="#i-size"/></svg>글씨</button>
    <button class="tool" id="plain"><svg class="ico"><use href="#i-plain"/></svg><span id="plainlab">글자만</span></button>
    <button class="tool" id="fit"><svg class="ico"><use href="#i-fit"/></svg>맞춤</button>
    <button class="tool" id="layers"><svg class="ico"><use href="#i-layers"/></svg>레이어</button>
    <button class="tool" id="rot"><svg class="ico"><use href="#i-rot"/></svg>돌리기</button>
    <button class="tool" id="pen"><svg class="ico"><use href="#i-pen"/></svg>펜</button>
    <button class="tool" id="measure"><svg class="ico"><use href="#i-ruler"/></svg>재기</button>
    <button class="tool" id="pptmode"><svg class="ico"><use href="#i-plain"/></svg><span id="pptmodelab">글로</span></button>
    <button class="tool" id="copy"><svg class="ico"><use href="#i-copy"/></svg>복사</button>
    <button class="tool" id="share"><svg class="ico"><use href="#i-share"/></svg>보내기</button>
  </footer>
</section>

<!-- ③-⑤ 두 판 견주기 (0.9.6 ⑪) -->
<section id="cmpview" class="view cmpview" hidden>
  <header class="bar">
    <button class="ib" id="cmpback" aria-label="뒤로"><svg class="ico"><use href="#i-back"/></svg></button>
    <div class="t"><div class="n" id="cmpname"></div><div class="s" id="cmpsub"></div></div>
    <button class="ib" id="cmpprev" aria-label="앞 달라진 쪽"><svg class="ico"><use href="#i-up"/></svg></button>
    <button class="ib" id="cmpnext" aria-label="다음 달라진 쪽"><svg class="ico"><use href="#i-down"/></svg></button>
  </header>
  <main id="cmpbox" class="cmpbox"><canvas id="cmpcv"></canvas><div id="cmpnote" class="cmp알림" hidden></div></main>
  <footer class="cmpfoot">
    <button class="pb" id="cmpleft" aria-label="앞 쪽">‹</button><span id="cmppage" class="cmp쪽"></span><button class="pb" id="cmpright" aria-label="다음 쪽">›</button>
    <div class="seg" id="cmpmode"><button data-v="앞">앞 판</button><button data-v="겹침" class="on">겹침</button><button data-v="뒤">뒤 판</button></div>
    <button class="pb" id="cmpzoom">크게</button><button class="pb" id="cmpswap" aria-label="앞뒤 바꾸기">⇄</button>
  </footer>
</section>

<!-- ③-④ PDF 쪽 목록 (v0.7) -->
<section id="thumbs" class="view thumbs" hidden>
  <header class="bar">
    <button class="ib" id="tclose" aria-label="닫기"><svg class="ico"><use href="#i-back"/></svg></button>
    <div class="t"><div class="n">쪽 목록</div><div class="s" id="tsub"></div></div>
    <label class="field 쪽칸"><input id="tn" type="number" inputmode="numeric" placeholder="쪽 번호" min="1" enterkeyhint="go"></label>
    <button class="btn" id="tgo">이동</button>
  </header>
  <div id="tkinds" class="칩줄" hidden></div>
  <main id="tgrid" class="tgrid"></main>
  <main id="tlist" class="tlist" hidden></main>
</section>

<div id="chip" class="chip" hidden></div><!-- 칩은 목록 · 보기 둘 다에서 보이게 밖으로 (10-05) -->

<div id="dim" class="dim" hidden></div>
<div id="sheet" class="sheet" hidden></div>

<script src="zip.js"></script>

<script src="xls.js"></script>
<script src="html.js"></script>

<script src="share.js"></script>

<script src="web.js"></script>

</body>
